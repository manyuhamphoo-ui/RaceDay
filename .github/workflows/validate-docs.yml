name: Validate RaceDay Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          test -d docs
          echo "docs folder exists"

      - name: Check ERD
        run: |
          test -f docs/ERD.png
          echo "ERD found"

      - name: Check API Endpoint Plan
        run: |
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          echo "API Endpoint Plan found"

      - name: Check SQL Database Script
        run: |
          test -f docs/RaceDay_Database.sql
          echo "SQL Database Script found"

      - name: Check README
        run: |
          test -f README.md
          echo "README found"

      - name: Validation successful
        run: |
          echo "RaceDay repository structure validated successfully."
